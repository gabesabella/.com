<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2027_Portfolio</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/boot.css" />
    <script type="importmap"></script>
  </head>
  <body>
    <div id="boot-screen">
      <pre id="boot-log"></pre><span class="boot-cursor">_</span>
    </div>
    <div id="app">
      <div class="loading-wrapper">
        <div class="spinner"></div>
      </div>
    </div>
    <script>
      function observeElementById(sectionId, navId) {
        const sectionElement = document.getElementById(sectionId);
        const navElement = document.getElementById(navId);

        const options = {
          root: null, // defaults to the viewport
          rootMargin: '-200px 0px -800px 0px', // shrinks the bottom boundary by 100px
          threshold: 0,
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              console.log(`${sectionId} is in view!`);
              navElement.classList.add('active');
            } else {
              console.log(`${sectionId} is out of view`);
              navElement.classList.remove('active');
            }
          });
        }, options);
    
        observer.observe(sectionElement);
      }
    </script>
    <script src="js/boot.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
      Blazor.start().then(() => {
        if (window.__bootReveal) window.__bootReveal();
      });
    </script>
  </body>
</html>
